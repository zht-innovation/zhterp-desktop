# Include under http {}. Replace loopback ports with the actual service ports.
upstream erp_legacy { server 127.0.0.1:3000; }
upstream erp_web { server 127.0.0.1:3100; }
upstream erp_api { server 127.0.0.1:3101; }

map $host $erp_release_mode {
    include /etc/nginx/erp/erp-release-mode.conf;
}

map "$request_method:$uri" $erp_api_owner {
    default none;
    include /etc/nginx/erp/generated/erp-api.map;
}

map "$request_method:$uri" $erp_safe_read {
    default 0;
    include /etc/nginx/erp/generated/erp-safe-reads.map;
}

map $uri $erp_legacy_page {
    default 0;
    include /etc/nginx/erp/generated/erp-legacy-pages.map;
}

map $uri $erp_desktop_page {
    default 0;
    include /etc/nginx/erp/generated/erp-desktop-pages.map;
}

map "$request_method:$uri" $erp_shared_site_write {
    default 0;
    "~^POST:/admin/login/?$" 0;
    "~^[A-Z]+:/(feedback|msg)/" 1;
    "~^(POST|PUT|PATCH|DELETE):/(admin|department|news)/" 1;
}

map "$erp_release_mode:$erp_api_owner:$erp_safe_read:$erp_shared_site_write" $erp_pause_request {
    default 1;
    "~^(legacy|active):" 0;
    "~^(legacy|active)_readonly:api:0:" 1;
    "~^(legacy|active)_readonly:[a-z]+:[01]:1$" 1;
    "~^(legacy|active)_readonly:" 0;
}

map "$erp_release_mode:$erp_api_owner:$erp_legacy_page" $erp_legacy_backend {
    default erp_legacy;
    "~^active(_readonly)?:api:" erp_api;
    "~^active(_readonly)?:none:1$" erp_web;
}

map "$erp_release_mode:$erp_api_owner:$erp_desktop_page" $erp_desktop_backend {
    default erp_web;
    "~^active(_readonly)?:(api|account):" erp_api;
    "~^legacy(_readonly)?:(api|account):" erp_legacy;
    "~^legacy(_readonly)?:none:1$" erp_legacy;
}

map $erp_release_mode $erp_desktop_assets {
    default erp_web;
    "~^legacy(_readonly)?$" erp_legacy;
}
