# Include in the ERP HTTPS virtual host after the signed packages pass acceptance.
location ~ ^/downloads/erp/(?<erp_release_file>[0-9]+\.[0-9]+\.[0-9]+/(?:zh-erp-windows-x64-setup\.exe|zh-erp-macos-universal\.dmg|SHA256SUMS\.txt))$ {
    alias /srv/erp/releases/$erp_release_file;
    types { text/plain txt; }
    default_type application/octet-stream;
    limit_except GET { deny all; }
}

location = /downloads/erp {
    return 404;
}

location /downloads/erp/ {
    return 404;
}
