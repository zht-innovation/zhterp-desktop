# This root must match the shared historical public attachment mount.
# Protected downloads continue to go through their ERP API handlers.
location ~ ^/main/(attachments|log-attachments|inventory|purchase-request|sales-order-(images|attachments|receivables)|sales-order-receipt-attachments)/ {
    root /srv/erp/public;
    try_files $uri =404;
    autoindex off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
