# Merge into the existing main-site HTTPS virtual host.
include /etc/nginx/erp/attachments.location.conf;

location ^~ /__erp/ {
    return 404;
}

location ^~ /_erp-assets/ {
    include /etc/nginx/erp/proxy-params.conf;
    proxy_pass http://erp_web;
}

location ^~ /_erp-icons/ {
    include /etc/nginx/erp/proxy-params.conf;
    proxy_pass http://erp_web;
}

location / {
    if ($erp_pause_request) { return 503; }
    include /etc/nginx/erp/proxy-params.conf;
    proxy_pass http://$erp_legacy_backend;
}
