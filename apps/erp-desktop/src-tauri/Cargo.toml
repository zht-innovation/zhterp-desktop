[package]
name = "zhterp-desktop"
version = "0.1.0"
description = "ZH ERP desktop client"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }
url = "2"

[dependencies]
base64 = "0.22"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "~2.12.6", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "~2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
updater-http = { package = "reqwest", version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
